name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.XC_KEYSTORE_B64 }}
          SERVER: ${{ secrets.XC_SERVER_URL }}
        run: |
          if [ -n "$KEY" ] && [ -n "$SERVER" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing/server secrets are not configured; skipping the signed APK build."
          fi

  build:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          [ -n "$SDKMANAGER" ] || SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Icon tooling
        run: pip install pillow

      - name: Decode signing key
        env:
          XC_KEYSTORE_B64: ${{ secrets.XC_KEYSTORE_B64 }}
        run: echo "$XC_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/xcaller-release.jks"

      - name: Build signed APK
        env:
          XC_SERVER_URL: ${{ secrets.XC_SERVER_URL }}
          XC_KEYSTORE: ${{ runner.temp }}/xcaller-release.jks
          XC_KEYSTORE_PASS: ${{ secrets.XC_KEYSTORE_PASS }}
          XC_KEY_ALIAS: ${{ secrets.XC_KEY_ALIAS }}
          XC_KEY_PASS: ${{ secrets.XC_KEY_PASS }}
        run: |
          cd android
          ./build.sh
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: xcaller-apk
          path: |
            android/dist/*.apk
            android/dist/SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/dist/*.apk
            android/dist/SHA256SUMS.txt
          generate_release_notes: true
