# XCaller behind nginx. Keep the /chat/ prefix: the server, manifest and
# service worker all assume it.
limit_req_zone $binary_remote_addr zone=chatapi:10m rate=120r/m;

server {
    listen 443 ssl http2;
    server_name xcaller.example.com;

    ssl_certificate     /etc/letsencrypt/live/xcaller.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcaller.example.com/privkey.pem;

    client_max_body_size 210m;

    location = /chat { return 301 /chat/; }

    location ~ ^/chat/api/ {
        limit_req zone=chatapi burst=40 nodelay;
        proxy_pass http://127.0.0.1:3910;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /chat/ {
        proxy_pass http://127.0.0.1:3910;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
