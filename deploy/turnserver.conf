# Minimal coturn configuration for XCaller. Replace the secret and realm.
listening-port=3478
tls-listening-port=5349
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME
realm=xcaller.example.com
server-name=xcaller.example.com

# Restrict the relay range to your public IP where possible.
# external-ip=203.0.113.10
min-port=49160
max-port=49200

# TLS for turns: (generate a certificate or reuse Let's Encrypt)
# cert=/etc/letsencrypt/live/xcaller.example.com/fullchain.pem
# pkey=/etc/letsencrypt/live/xcaller.example.com/privkey.pem

no-cli
no-tlsv1
no-tlsv1_1
